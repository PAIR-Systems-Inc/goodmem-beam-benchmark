[project]
name = "goodmem-beam-benchmark"
version = "0.1.0"
description = "Evaluate GoodMem with an iterative ReAct agent on the full BEAM-10M histories"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pyarrow>=19", "tiktoken>=0.9", "scipy>=1.15"]

[project.scripts]
beam = "goodmem_beam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodmem_beam"]

[tool.ruff]
line-length = 100
target-version = "py311"
